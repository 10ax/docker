services:
  adguard-home:
    container_name: adguard-home
    image: adguard/adguardhome:latest
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://192.168.1.7:3001"]
      interval: 30s
      timeout: 10s
      retries: 5